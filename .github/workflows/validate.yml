name: Validate PowerAgent JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check builder.js
          node --check demo-project.js
          node --check studio.js
          node --check offline-builder.js
          node --check functions/api/build.js
          node --check functions/api/chat.js
          node --check functions/api/diagnose.js
          node --check functions/api/models.js
          node --check functions/api/version.js
      - name: Check linked frontend assets
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');for(const p of ['builder.js','demo-project.js','studio.js','studio.css','offline-builder.js']){if(!fs.existsSync(p)||!h.includes(p))throw Error('Missing linked asset '+p)}"
