name: Validate PowerAgent JavaScript
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check builder.js
          node --check functions/api/build.js
          node --check functions/api/chat.js
          node --check functions/api/diagnose.js
          node --check functions/api/models.js
          node --check functions/api/version.js
